# Prometheus scrape config for the joyjoy `observability` compose profile (the baked
# stack — docker-compose.yml). Mounted at /etc/prometheus/prometheus.yml. The backend
# exposes /metrics whenever the `observability` profile is active. (For the host-run
# backend under docker-compose.dev.yml, prometheus.dev.yml scrapes host.docker.internal.)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: joyjoy-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]   # the joyjoy backend service on joyjoy-net

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
